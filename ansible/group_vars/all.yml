---
# Exported for every interactive login shell (see roles/session_comfort/templates/jump-host-login-env.sh.j2).
# Optional jump_host_login_env_extra in extra-vars (e.g. ansible/users.yaml) merges on top without repeating keys here.
# Setting jump_host_login_env in the same extra-vars file replaces this dict entirely (Ansible merge rules).
jump_host_login_env: {}

users: []
managed_user_uid_min: 1000
managed_user_exclusions:
  - ec2-user
  - ssm-user
  - nobody

home_volume_device_candidates:
  - /dev/nvme1n1
  - /dev/xvdf
  - /dev/sdf
home_volume_mount_path: /home
home_volume_fstype: ext4

user_accounts_ops_sudo_commands:
  - /usr/bin/systemctl --no-pager status *
  - /usr/bin/systemctl --no-pager is-active *
  - /usr/bin/systemctl --no-pager is-failed *
  - /usr/bin/systemctl --no-pager is-enabled *
  - /usr/bin/journalctl --no-pager -u *
  - /usr/bin/journalctl --no-pager --unit=*
