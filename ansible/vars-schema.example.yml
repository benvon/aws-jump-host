---
# Optional: extra login exports merged after ansible/group_vars/all.yml jump_host_login_env (overlay wins on duplicate keys).
jump_host_login_env_extra:
  AWS_REGION: us-west-2

# Optional: prepend (before ~/bin) / append PATH entries for every interactive shell.
jump_host_path_prefix_dirs_extra:
  - /opt/custom/bin
jump_host_path_suffix_dirs_extra:
  - /usr/local/extra/bin

# Optional: extra RPMs installed with the baseline session_comfort package task (dnf).
jump_host_extra_packages_extra:
  - vim-enhanced

# Optional: kubectl pkgs.k8s.io minor channel — use *_extra from answers file or set jump_host_kubectl_channel in group_vars.
jump_host_kubectl_channel_extra: v1.33

# Optional: Helm tarball version from https://get.helm.sh/ (no leading v).
jump_host_helm_version_extra: "3.15.0"

# Example external user declaration schema.
#
# WARNING — sudo_profile: admin uses unrestricted passwordless root (NOPASSWD:ALL) by default.
# To migrate later, set role vars user_accounts_admin_use_unrestricted_sudo: false and
# user_accounts_admin_sudo_commands: [ '/usr/bin/somecmd', ... ] (see ansible/roles/user_accounts/defaults/main.yml).
users:
  - username: jumpops
    access_profile: ops
    # Optional: allowlist IAM roles that may start SSM sessions as this Linux user.
    iam_role_arns:
      - arn:aws:iam::123456789012:role/AWSReservedSSO_jumpops-access_aaaaaaaaaaaaaaaa
    groups:
      - ops
    sudo_profile: ops
    state: present
    shell: /bin/bash
    home: /home/jumpops

  # Example only: admin = full root on the bastion. Prefer ops profile + break-glass admin only if required.
  - username: platform-admin
    access_profile: ops
    iam_role_arns:
      - arn:aws:iam::123456789012:role/AWSReservedSSO_platform-admin-access_bbbbbbbbbbbbbbbb
    groups:
      - platform
    sudo_profile: admin
    state: present
